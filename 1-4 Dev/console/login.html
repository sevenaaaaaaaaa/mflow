<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>MFlow 登录</title>
<style>body{font-family:-apple-system,"PingFang SC",sans-serif;background:#141a24;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#fff}
.box{background:#1e2836;padding:36px 32px;border-radius:12px;width:300px}h1{font-size:18px;margin:0 0 6px}
p{color:#9fb3c8;font-size:12px;margin:0 0 20px}input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #3a4a5e;background:#141a24;color:#fff;font-size:14px}
button{width:100%;margin-top:12px;padding:10px;border:none;border-radius:8px;background:#2b6cb0;color:#fff;font-size:14px;cursor:pointer}
#err{color:#e07b7b;font-size:12px;margin-top:10px;min-height:16px}</style></head>
<body><div class="box"><h1>MFlow 工作台</h1><p>Lovart GEO 内容工作流 · 请输入访问密码</p>
<input id="pw" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')go()">
<button onclick="go()">进入工作台</button><div id="err"></div></div>
<script>async function go(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
if(r.ok)location.reload();else document.getElementById('err').textContent='密码错误，重试'}</script></body></html>
