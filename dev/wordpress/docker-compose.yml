# Local WordPress test environment: docker compose up -d → http://localhost:8090
# Optional theme hot-mount: WP_THEME_DIR=/path/to/theme WP_THEME_SLUG=my-theme docker compose up -d
services:
  wp:
    image: docker.m.daocloud.io/library/wordpress:6.7-php8.3-apache
    ports: ["8090:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp_data:/var/www/html
      - ${WP_THEME_DIR:-./theme}:/var/www/html/wp-content/themes/${WP_THEME_SLUG:-mflow-theme}
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
volumes:
  wp_data:
  db_data:
