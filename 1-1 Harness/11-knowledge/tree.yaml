        notes: "Project-scoped config; skill paths list 1-1 Harness/Skills."
      tool-cursor:
        label: "Cursor"
        type: tool
        own: ~/.cursor/ -- project-local .cursor/
        path: .cursor/rules/ + .cursor/skills/
