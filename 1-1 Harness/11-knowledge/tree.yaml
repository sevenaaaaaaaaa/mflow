# ---------------------------------------------------------------------------
tree:
  layer-0-tools:
    label: "Layer 0 — 5 AI agent entry points"
    children:
      tool-hermes:
        label: "Hermes"
        type: tool
        own: hermes-binary-at-~/.hermes/bin/hermes-agent
