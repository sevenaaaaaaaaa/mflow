        own: ~/.claude/
        path: 1-1 Harness/CLAUDE.md + .claude/skills/ + .claude/agents/
        profiles: [default + agents: lovart-intel, lovart-blog, lovart-page, lovart-qa, lovart-publisher, lovart-distributor, lovart-orchestrator]
        notes: "auto-discovers .claude/skills/ + 7 named agents."
      tool-codex:
        label: "Codex"
        type: tool
        own: ~/.codex/
        path: AGENTS.md (project-root) + uses Claude-skills-via-AGENTS.md
