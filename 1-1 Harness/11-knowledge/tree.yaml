# tree.yaml — Lovart MFlow Knowledge Tree (hierarchical view)
# Schema: nodes + nested-tree view. Derived from entities.yaml + relationships.yaml
# by dream/consolidate.sh nightly.
#
# Convention:
#   id       : dash-case, unique across the entire tree
#   type     : one of [tool, profile, rule, skill, workflow, cron, path-segment,
#                       project, product, dataset, destination, concept]
#   layer    : one of [0-tool, 1-harness, 2-vault, 3-delivery] (alignment w/ README)
#   own      : which agent / profile owns truth for this node
#   path     : filesystem path relative to vault root (1-Project/Lovart MFlow/)
#
# Status semantics:
#   active    : in production use
#   legacy    : kept for backward-compat, do NOT extend
#   planned   : declared but not built yet
#   archived  : moved to 1-8 Backup/archives/

version: 1.0
generated: 2026-07-05
generator: dream/consolidate.sh
schema_version: 1

# ---------------------------------------------------------------------------
# Top-level tree (3 visible roots)
